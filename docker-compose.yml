version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitraspace-ecommerce
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8082:8082"
    environment:
      - APP_URL=http://localhost:8082
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_URL=${DB_URL:-}
    restart: unless-stopped
